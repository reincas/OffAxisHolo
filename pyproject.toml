[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "offaxisholo"
version = "0.1.0"
description = "Numerical function library for reconstruction of holograms captured with an off-axis transmissive digital holographic microscope (DHM)."
readme = "README.md"
# Baseline G9 (2026-11-18): >= 3.12, tested on 3.12 and 3.14 (DHM-PC: 3.14).
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "array-api-compat>=1.11",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "opencv-python>=4.10.0.82",
    "scidatacontainer>=1.2.0",
    "scipy>=1.17.1",
    "scikit-image>=0.25.2"
]


[project.optional-dependencies]
# GPU backend (NVIDIA CUDA 13, as on the DHM-PC). With a CUDA 12 driver install
# "cupy-cuda12x" by hand instead.
gpu = [
    "cupy-cuda13x>=13.6"
]
dev = [
    "black",
    "ruff",
    "pytest"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["offaxisholo*"]

[tool.setuptools.package-data]
offaxisholo = [
    "config/**/*.json",
    "config/**/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/golden/ holds the generator of the golden data, not tests
norecursedirs = ["golden", ".*", "build", "*.egg-info"]
markers = [
    "gpu: requires CuPy and a CUDA device",
    "slow: long running test",
    "hardware: requires the measurement PC (camera)",
]


[tool.black]
line-length = 88
# reference material is kept verbatim (also when passed explicitly by pre-commit)
force-exclude = "docs/realtime/reference/"


[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs/realtime/reference"]
force-exclude = true


[tool.ruff.lint]
select = ["E", "F", "I", "B"]
